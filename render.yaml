databases:
  - name: careerscope-db
    databaseName: careerscope
    user: careerscope
    plan: free

services:
  - type: web
    name: careerscope-ai
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /health
    autoDeploy: true
    buildCommand: >-
      cd ../frontend && npm ci && npm run build &&
      cd ../backend && rm -rf static && cp -r ../frontend/dist static &&
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: careerscope-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false